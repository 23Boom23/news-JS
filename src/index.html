<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <h1>News Portal</h1>
        </header>
        <main>
            <div class="sources buttons"></div>
            <p class="status" role="status" aria-live="polite">Loading sources…</p>
            <div class="news"></div>
        </main>
        <footer>
            <p class="copyright">
                2026 <a href="https://github.com/23boom23" target="_blank" rel="noopener noreferrer">23boom23</a>
                · <a href="https://newsapi.org">NewsAPI</a>
                · <a href="https://rs.school/courses/javascript" target="_blank" rel="noopener noreferrer"><img src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RS School" width="70" height="35" /></a>
            </p>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
