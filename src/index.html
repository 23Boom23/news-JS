<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#f6f4ee" />
        <meta name="description" content="A curated news feed from publishers around the world." />
        <title>Newsroom — World news, one view</title>
    </head>
    <body>
        <div class="page-shell">
            <header class="site-header">
                <a class="brand" href="./" aria-label="Newsroom home">
                    <span class="brand__mark" aria-hidden="true">N.</span>
                    <span>NEWSROOM</span>
                </a>
                <span class="site-header__label">A clearer view of the world</span>
            </header>

            <main>
                <section class="hero" aria-labelledby="hero-title">
                    <div>
                        <p class="eyebrow"><span class="eyebrow__dot"></span> THE DAILY BRIEF</p>
                        <h1 id="hero-title">Stories worth<br /><em>your time.</em></h1>
                        <p class="hero__intro">Choose a publisher and explore the latest stories in one calm place.</p>
                    </div>
                    <div class="hero__aside" aria-hidden="true">
                        <span class="hero__issue">01 / 2026</span>
                        <span class="hero__circle">N</span>
                    </div>
                </section>

                <section class="feed" aria-labelledby="feed-title">
                    <div class="section-heading">
                        <div>
                            <p class="eyebrow">EXPLORE</p>
                            <h2 id="feed-title">The latest</h2>
                        </div>
                        <p class="section-heading__aside">Select a source to read its stories</p>
                    </div>
                    <div class="sources" role="group" aria-label="News sources"></div>
                    <p class="status" role="status" aria-live="polite">Loading sources…</p>
                    <div class="news" aria-live="polite"></div>
                </section>
            </main>

            <footer class="site-footer">
                <p>© 2026 <a href="https://github.com/23boom23" target="_blank" rel="noopener noreferrer">23boom23</a> · News data by <a href="https://newsapi.org/" target="_blank" rel="noopener noreferrer">News API</a></p>
                <a class="school-link" href="https://rs.school/courses/javascript" target="_blank" rel="noopener noreferrer" aria-label="RS School JavaScript course">
                    <img src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RS School" />
                </a>
            </footer>
        </div>
    </body>
</html>
